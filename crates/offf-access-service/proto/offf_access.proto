syntax = "proto3";

package offf.access.v1;

service OfffAccessService {
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc WriteAnalysisResults(WriteAnalysisResultsRequest) returns (WriteAnalysisResultsResponse);
  rpc AppendAnalysisCorrection(AppendAnalysisCorrectionRequest) returns (AppendAnalysisCorrectionResponse);
  rpc AppendProvenanceEvent(AppendProvenanceEventRequest) returns (AppendProvenanceEventResponse);
  // Object-producing worker RPCs (Sprint 11)
  rpc WriteObjectDelta(WriteObjectDeltaRequest) returns (WriteObjectDeltaResponse);
  rpc WriteObjectEdgeDelta(WriteObjectEdgeDeltaRequest) returns (WriteObjectEdgeDeltaResponse);
  rpc WriteDerivationDelta(WriteDerivationDeltaRequest) returns (WriteDerivationDeltaResponse);
  rpc WriteMaterializedObject(WriteMaterializedObjectRequest) returns (WriteMaterializedObjectResponse);
  rpc GetObjects(GetObjectsRequest) returns (GetObjectsResponse);
  rpc GetObjectChildren(GetObjectChildrenRequest) returns (GetObjectChildrenResponse);
  rpc GetObjectParents(GetObjectParentsRequest) returns (GetObjectParentsResponse);
  rpc GetObjectLineage(GetObjectLineageRequest) returns (GetObjectLineageResponse);
  rpc GetObjectContent(GetObjectContentRequest) returns (GetObjectContentResponse);
}

message GetManifestRequest { string case_id = 1; }
message GetManifestResponse { string manifest_json = 1; }

message GetChunkRequest {
  string case_id = 1;
  string chunk_id = 2;
}
message GetChunkResponse { bytes plaintext = 1; }

message VerifyChunkRequest {
  string case_id = 1;
  string chunk_id = 2;
}
message VerifyChunkResponse { bool ok = 1; }

message ListFilesRequest {
  string case_id = 1;
  string partition_id = 2;
}

message FileRow {
  uint64 file_id = 1;
  string filesystem_id = 2;
  string partition_id = 3;
  string path = 4;
  string filename = 5;
  string extension = 6;
  uint64 size_bytes = 7;
  bool is_directory = 8;
  bool is_deleted = 9;
}

message ListFilesResponse { repeated FileRow files = 1; }

message GetFileRequest {
  string case_id = 1;
  uint64 file_id = 2;
}
message GetFileResponse { FileRow file = 1; }

message ListArtifactsRequest { string case_id = 1; }
message ListArtifactsResponse { repeated string paths = 1; }

message AnalysisRow { string json = 1; }

message WriteAnalysisResultsRequest {
  string case_id = 1;
  string relative_path = 2;
  repeated AnalysisRow rows = 3;
}

message WriteAnalysisResultsResponse {
  bool ok = 1;
  string path = 2;
}

message AppendAnalysisCorrectionRequest {
  string case_id = 1;
  string actor = 2;
  string correction_of = 3;
  string correction_type = 4;
  string reason = 5;
  string provenance_ref = 6;
}

message AppendAnalysisCorrectionResponse {
  bool ok = 1;
  string event_id = 2;
  string timestamp = 3;
  string path = 4;
}

message AppendProvenanceEventRequest {
  string case_id = 1;
  string action = 2;
  string actor = 3;
  string details_json = 4;
  string tool_name = 5;
  string tool_version = 6;
}

message AppendProvenanceEventResponse {
  bool ok = 1;
  string event_id = 2;
  string timestamp = 3;
}

// ── Object-producing worker messages (Sprint 11) ──────────────────────────────

message ObjectRow { string json = 1; }

message WriteObjectDeltaRequest {
  string case_id = 1;
  string job_id = 2;
  repeated ObjectRow rows = 3;
}
message WriteObjectDeltaResponse {
  bool ok = 1;
  string path = 2;
  string sha256 = 3;
}

message WriteObjectEdgeDeltaRequest {
  string case_id = 1;
  string job_id = 2;
  repeated ObjectRow rows = 3;
}
message WriteObjectEdgeDeltaResponse {
  bool ok = 1;
  string path = 2;
  string sha256 = 3;
}

message WriteDerivationDeltaRequest {
  string case_id = 1;
  string job_id = 2;
  repeated ObjectRow rows = 3;
}
message WriteDerivationDeltaResponse {
  bool ok = 1;
  string path = 2;
  string sha256 = 3;
}

message WriteMaterializedObjectRequest {
  string case_id = 1;
  string job_id = 2;
  bytes content = 3;
}
message WriteMaterializedObjectResponse {
  bool ok = 1;
  string sha256 = 2;
}

message GetObjectsRequest { string case_id = 1; }
message GetObjectsResponse { repeated string rows_json = 1; }

message GetObjectChildrenRequest {
  string case_id = 1;
  string object_id = 2;
}
message GetObjectChildrenResponse { repeated string rows_json = 1; }

message GetObjectParentsRequest {
  string case_id = 1;
  string object_id = 2;
}
message GetObjectParentsResponse { repeated string rows_json = 1; }

message GetObjectLineageRequest {
  string case_id = 1;
  string object_id = 2;
}
message GetObjectLineageResponse { repeated string rows_json = 1; }

message GetObjectContentRequest {
  string case_id = 1;
  string sha256 = 2;
}
message GetObjectContentResponse { bytes content = 1; }
