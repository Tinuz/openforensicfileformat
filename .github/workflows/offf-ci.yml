name: OFFF CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy strict
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test workspace
        run: cargo test --workspace -- --nocapture

      - name: Cargo build release
        run: cargo build --workspace --release

  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CLI E2E workflow
        run: python tests/e2e/run_cli_e2e.py

      - name: Upload CLI E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-report
          path: tests/e2e/cli-e2e-report.json

  python-sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SDK API contract test
        working-directory: sdk/python
        run: python -m unittest tests/test_api_contract.py -v

  go-sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run Go SDK tests
        working-directory: sdk/go
        run: go test ./...

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schema JSON files
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          roots = [
              Path('docs/schema'),
              Path('sdk/python/offf_sdk/schemas'),
          ]

          files = []
          for root in roots:
              if root.exists():
                  files.extend(sorted(root.glob('*.json')))

          if not files:
              raise SystemExit('No schema JSON files found')

          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

  conformance-scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run conformance scaffold
        run: python tests/conformance/run_conformance.py

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: tests/conformance/conformance-report.json

  check-maturity-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check OFFF component metadata
        run: python scripts/check_component_metadata.py

  check-test-traceability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check test traceability matrix
        run: python scripts/check_test_traceability.py

  generate-release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate release readiness report
        run: python scripts/generate_release_readiness.py

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: |
            reports/release-readiness.json
            reports/release-readiness.md
